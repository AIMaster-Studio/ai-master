name: DevLog Auto Reminder

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  devlog-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate DevLogs & Remind US Members
        run: |
          python scripts/auto_dev_log.py --all --check
