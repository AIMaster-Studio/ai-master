<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>历史对话 - AIMaster</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #05070f;
    color: #dbe6f5;
    min-height: 100vh;
  }
  #demo-stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .container { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }
  header { text-align: center; padding: 30px 0 10px; }
  header h1 {
    font-size: 28px;
    background: linear-gradient(120deg, #72f6e4, #a99bff);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  header p { color: #8d9cbd; margin-top: 8px; font-size: 14px; }
  .toolbar { display: flex; justify-content: center; gap: 12px; margin: 20px 0; flex-wrap: wrap; }
  .btn {
    padding: 8px 18px; border: 1px solid rgba(114,246,228,.3); border-radius: 999px;
    background: rgba(114,246,228,.08); color: #72f6e4; cursor: pointer; font-size: 13px;
    transition: all .2s;
  }
  .btn:hover { background: rgba(114,246,228,.18); transform: translateY(-1px); }
  .btn.primary { background: linear-gradient(120deg, rgba(114,246,228,.25), rgba(169,155,255,.25)); border-color: rgba(169,155,255,.4); }
  .stats { text-align: center; color: #9fb2c7; font-size: 13px; margin-bottom: 24px; }
  .stats b { color: #ffd75e; }
  .session-list { display: grid; gap: 14px; }
  .session-card {
    background: rgba(13,22,40,.6); border: 1px solid rgba(114,246,228,.14);
    border-radius: 14px; padding: 16px 18px; cursor: pointer;
    transition: all .25s;
  }
  .session-card:hover { border-color: rgba(114,246,228,.4); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  .session-card h3 { font-size: 15px; color: #eafffb; margin-bottom: 6px; }
  .session-card .meta { font-size: 12px; color: #7381a1; display: flex; gap: 14px; flex-wrap: wrap; }
  .session-card .preview { font-size: 13px; color: #9fb2c7; margin-top: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-card .msg-count { color: #72f6e4; font-weight: 600; }
  .empty { text-align: center; color: #7381a1; padding: 60px 0; }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }
  /* 详情视图 */
  #detailView { display: none; }
  .detail-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .detail-header h2 { font-size: 20px; color: #eafffb; flex: 1; }
  .back-btn { color: #8d9cbd; cursor: pointer; font-size: 14px; }
  .back-btn:hover { color: #72f6e4; }
  .msg {
    margin: 10px 0; padding: 14px 16px; border-radius: 12px; font-size: 14px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user { background: rgba(79,140,255,.12); border-left: 3px solid #4f8cff; margin-left: 8%; }
  .msg.assistant { background: rgba(13,22,40,.7); border: 1px solid rgba(114,246,228,.12); margin-right: 8%; }
  .msg .role-tag { font-size: 11px; color: #7381a1; display: block; margin-bottom: 6px; }
  .msg.user .role-tag { color: #8fb4ff; }
  .msg.assistant .role-tag { color: #72f6e4; }
  .msg.tool { background: rgba(255,215,94,.06); border-left: 3px solid #ffd75e; margin-left: 4%; margin-right: 4%; font-size: 13px; color: #c9b98a; }
  .loading { text-align: center; color: #72f6e4; padding: 40px; }
  .loading::after { content: ''; display: inline-block; width: 14px; height: 14px; margin-left: 8px; border: 2px solid rgba(114,246,228,.3); border-top-color: #72f6e4; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: rgba(20,26,34,.95); border: 1px solid rgba(114,246,228,.3);
    color: #eafffb; padding: 10px 20px; border-radius: 999px; font-size: 13px; z-index: 999;
    display: none;
  }
  @media (max-width: 640px) {
    .msg.user { margin-left: 3%; }
    .msg.assistant { margin-right: 3%; }
  }
</style>
</head>
<body>
<canvas id="demo-stars" class="dash-space"></canvas>
<div class="container">
  <header>
    <h1>📜 历史对话</h1>
    <p>读取 DSH 本地会话记录 · 对话内容仅存于本机</p>
  </header>
  <div class="toolbar">
    <button class="btn primary" id="refreshBtn">🔄 刷新</button>
    <button class="btn" id="openDshBtn">📂 打开 DSH 会话目录</button>
  </div>
  <div class="stats" id="stats"></div>
  <div id="listView">
    <div class="session-list" id="sessionList"></div>
  </div>
  <div id="detailView">
    <div class="detail-header">
      <span class="back-btn" id="backBtn">← 返回列表</span>
      <h2 id="detailTitle"></h2>
    </div>
    <div id="detailMsgs"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function () {
  'use strict';
  var sessionList = document.getElementById('sessionList');
  var statsEl = document.getElementById('stats');
  var listView = document.getElementById('listView');
  var detailView = document.getElementById('detailView');
  var detailMsgs = document.getElementById('detailMsgs');
  var detailTitle = document.getElementById('detailTitle');
  var toastEl = document.getElementById('toast');

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.style.display = 'block';
    setTimeout(function () { toastEl.style.display = 'none'; }, 2500);
  }

  function fmtTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') +
      ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  function renderList() {
    if (!window.aimasterDesktop || !window.aimasterDesktop.listSessions) {
      sessionList.innerHTML = '<div class="empty"><div class="icon">😢</div>桌面桥接不可用，请从桌面应用打开此页面</div>';
      return;
    }
    sessionList.innerHTML = '<div class="loading">正在读取历史对话...</div>';
    window.aimasterDesktop.listSessions().then(function (res) {
      if (!res.ok) { sessionList.innerHTML = '<div class="empty">读取失败：' + res.error + '</div>'; return; }
      var sessions = res.sessions;
      statsEl.innerHTML = '共 <b>' + sessions.length + '</b> 个会话';
      if (!sessions.length) {
        sessionList.innerHTML = '<div class="empty"><div class="icon">🗂️</div>没有找到历史会话</div>';
        return;
      }
      var html = '';
      sessions.forEach(function (s) {
        html += '<div class="session-card" data-id="' + s.id + '">' +
          '<h3>' + (s.title || '未命名会话') + '</h3>' +
          '<div class="meta"><span>🕐 ' + fmtTime(s.lastTime) + '</span>' +
          '<span class="msg-count">💬 ' + s.messageCount + ' 条消息</span>' +
          '<span>📁 ' + s.cwd + '</span></div>' +
          (s.preview ? '<div class="preview">' + s.preview + '</div>' : '') +
          '</div>';
      });
      sessionList.innerHTML = html;
      sessionList.querySelectorAll('.session-card').forEach(function (card) {
        card.addEventListener('click', function () {
          openSession(card.getAttribute('data-id'));
        });
      });
    }).catch(function (e) {
      sessionList.innerHTML = '<div class="empty">读取失败：' + e.message + '</div>';
    });
  }

  function openSession(id) {
    if (!window.aimasterDesktop || !window.aimasterDesktop.readSession) { showToast('桥接不可用'); return; }
    detailMsgs.innerHTML = '<div class="loading">加载对话...</div>';
    window.aimasterDesktop.readSession(id).then(function (res) {
      if (!res.ok) { showToast('读取失败：' + res.error); return; }
      listView.style.display = 'none';
      detailView.style.display = 'block';
      detailTitle.textContent = res.title || '会话';
      var html = '';
      (res.messages || []).forEach(function (m) {
        if (m.role === 'user') {
          html += '<div class="msg user"><span class="role-tag">🧑 你</span>' + escapeHtml(m.text) + '</div>';
        } else if (m.role === 'assistant') {
          html += '<div class="msg assistant"><span class="role-tag">🤖 助手</span>' + escapeHtml(m.text) + '</div>';
        } else {
          html += '<div class="msg tool"><span class="role-tag">🔧 ' + escapeHtml(m.role) + '</span>' + escapeHtml(m.text) + '</div>';
        }
      });
      detailMsgs.innerHTML = html || '<div class="empty">此会话没有可显示的消息</div>';
    }).catch(function (e) { showToast('加载失败：' + e.message); });
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  document.getElementById('refreshBtn').addEventListener('click', renderList);
  document.getElementById('backBtn').addEventListener('click', function () {
    detailView.style.display = 'none';
    listView.style.display = 'block';
    renderList();
  });
  document.getElementById('openDshBtn').addEventListener('click', function () {
    if (window.aimasterDesktop && window.aimasterDesktop.openSessionsDir) {
      window.aimasterDesktop.openSessionsDir();
    }
  });

  renderList();
})();
</script>
<link rel="stylesheet" href="../static/avatar-widget/avatar-widget.css" />
<script src="../static/avatar-widget/avatar-widget.js" defer></script>
</body>
</html>
