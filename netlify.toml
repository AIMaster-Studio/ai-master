[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "22"
  DEEPSEEK_MODEL = "deepseek-flash"

[functions]
  directory = "netlify/functions"
  node_bundler = "zisi"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/"
  to = "/frontend/learning-center/"
  status = 200

[[redirects]]
  from = "/*"
  to = "/frontend/:splat"
  status = 200
