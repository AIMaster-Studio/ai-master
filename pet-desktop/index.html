<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>AIMaster 桌宠</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  #pet-stage {
    position: fixed; left: 0; top: 0;
    width: 220px; height: 124px;
    transform-origin: bottom center;
    cursor: grab;
    will-change: transform, left, top;
  }
  #pet-stage.dragging { cursor: grabbing; }
  #pet-whale {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%;
    pointer-events: auto;
    -webkit-user-drag: none;
  }
  #pet-video {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    display: none;
  }
  #pet-bubble {
    position: absolute;
    left: 50%; bottom: 100%;
    transform: translateX(-50%) translateY(-6px);
    background: rgba(11, 19, 34, 0.92);
    color: #dbe6f5;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    max-width: 280px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
    border: 1px solid rgba(114, 246, 228, 0.3);
  }
  #pet-bubble.show { opacity: 1; }
  #pet-bubble::after {
    content: '';
    position: absolute;
    left: 50%; top: 100%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: rgba(11, 19, 34, 0.92);
  }
  .aw-flipped #pet-whale, .aw-flipped #pet-video {
    transform: scaleX(-1);
  }
  .aw-pressed #pet-whale, .aw-pressed #pet-video {
    transform: scaleY(0.88) scaleX(1.06);
    transition: transform 0.08s ease;
  }
  .aw-flipped.aw-pressed #pet-whale, .aw-flipped.aw-pressed #pet-video {
    transform: scaleX(-1) scaleY(0.88) scaleX(1.06);
  }
  #pet-focus-badge {
    position: absolute;
    top: -10px; right: -10px;
    background: linear-gradient(120deg, #ff6b6b, #ff8e53);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    display: none;
    align-items: center;
    gap: 4px;
    box-shadow: 0 2px 10px rgba(255,107,107,0.5);
    pointer-events: auto;
    white-space: nowrap;
  }
  #pet-sleep-icon {
    position: absolute;
    top: -8px; left: 50%;
    transform: translateX(-50%);
    font-size: 18px;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
    animation: floatZ 2s ease-in-out infinite;
  }
  .aw-sleeping #pet-sleep-icon { opacity: 1; }
  .aw-sleeping #pet-whale, .aw-sleeping #pet-video {
    filter: brightness(0.7) saturate(0.6);
  }
  @keyframes floatZ {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-6px); }
  }
</style>
</head>
<body>
  <div id="pet-stage">
    <img id="pet-whale" draggable="false" alt="桌宠" />
    <video id="pet-video" autoplay muted playsinline></video>
    <div id="pet-sleep-icon">💤</div>
    <div id="pet-focus-badge"></div>
    <div id="pet-bubble"></div>
  </div>
  <script src="pet-desktop.js"></script>
</body>
</html>
