# Render Blueprint: paid service + persistent disk. Review costs before creating.
# Deploy the reviewed remediation branch. Automatic deployment stays disabled.
services:
  - type: web
    name: aimaster
    runtime: node
    plan: starter
    region: singapore
    branch: fix/ican-review-20260917
    autoDeploy: false
    buildCommand: npm ci --omit=dev
    startCommand: npm run web
    healthCheckPath: /api/status
    disk:
      name: aimaster-data
      mountPath: /var/data/aimaster
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: AIMASTER_DATA_ROOT
        value: /var/data/aimaster
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        sync: false
      - key: AIMASTER_CONFIG_TOKEN
        generateValue: true
